[package]
name = "vivvy-core"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "Core vector index engine for Vivvy — single-machine, memory-honest vector search"
repository = "https://github.com/one2seven-oss/vivvy"
homepage = "https://github.com/one2seven-oss/vivvy"
readme = "README.md"
keywords = ["vector-search", "hnsw", "embeddings", "ann", "similarity"]
categories = ["algorithms", "data-structures"]

[features]
default = []
async = ["tokio", "futures"]
prometheus = ["dep:prometheus"]

[dependencies]
fastrand = "2"
ordered-float = { version = "4", features = ["std"] }
memmap2 = "0.9"
bytemuck = { version = "1", features = ["derive"] }
thiserror = "2"
log = "0.4"
roaring = "0.10"
rayon = "1"
rand = "0.9"
arc-swap = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"], optional = true }
prometheus = { version = "0.13", optional = true }
tokio = { version = "1", features = ["sync", "rt", "time"], optional = true }
futures = { version = "0.3", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
tempfile = "3"
