# Optional dev convenience only (see `make header`). go/include/vivvy.h is
# hand-maintained and is the header actually shipped/linked against; this
# config exists so a contributor with cbindgen installed can generate a
# candidate header to diff against it by hand, not to replace it blindly.

language = "C"
cpp_compat = true
include_guard = "VIVVY_H"
autogen_warning = "/* Candidate header generated by cbindgen — diff against the hand-maintained go/include/vivvy.h before using. */"
no_includes = false
sys_includes = ["stddef.h"]

[export]
prefix = "Vivvy"
include = ["CVivvyStore"]

[fn]
prefix = ""
